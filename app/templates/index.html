<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengirim Lamaran Kerja</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
        h1 { margin-bottom: 1.5rem; color: #1a1a2e; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        button { width: 100%; padding: 0.875rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .flash { padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .flash-success { background: #dcfce7; color: #166534; }
        .flash-danger { background: #fee2e2; color: #991b1b; }
        .cv-notice { background: #fef3c7; border: 1px solid #fcd34d; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.875rem; }
    </style>
</head>
<body>
    <h1>Pengirim Lamaran Kerja</h1>

    <div class="cv-notice">
        <strong>Catatan:</strong> Pastikan file CV (cv.pdf) ada di folder root project sebelum mengirim.
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label for="perusahaan">Nama Perusahaan *</label>
            <input type="text" id="perusahaan" name="perusahaan" placeholder="PT. Contoh Perusahaan" required>
        </div>

        <div class="form-group">
            <label for="posisi">Posisi Dilamar *</label>
            <input type="text" id="posisi" name="posisi" placeholder="Teknisi Jaringan" required>
        </div>

        <div class="form-group">
            <label for="email_hrd">Email HRD *</label>
            <input type="email" id="email_hrd" name="email_hrd" placeholder="hrd@perusahaan.com" required>
        </div>

        <div class="form-group">
            <label for="kategori">Kategori Template *</label>
            <select id="kategori" name="kategori" required>
                <option value="">-- Pilih Kategori --</option>
                {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat.replace('_', ' ').title() }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Kirim Lamaran</button>
    </form>
</body>
</html>
